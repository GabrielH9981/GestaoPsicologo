{% extends 'base.html' %}
{% block title %}Editar Paciente{% endblock %}
{% block page_title %}Editar — {{ paciente.nome }}{% endblock %}
{% block topbar_actions %}
<a href="{{ url_for('pacientes.perfil', id=paciente.id) }}" class="btn btn-ghost btn-sm">← Voltar</a>
{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:860px">
    <div class="card-body">
        <form method="post">
            <div class="row">
                <div class="col-6">
                    <label class="form-label">Nome *</label>
                    <input type="text" class="form-control" name="nome" value="{{ paciente.nome }}" required>
                </div>
                <div class="col-3">
                    <label class="form-label">Nascimento *</label>
                    <input type="date" class="form-control" name="data_nascimento" value="{{ paciente.data_nascimento }}" required>
                </div>
                <div class="col-3">
                    <label class="form-label">Telefone *</label>
                    <input type="text" class="form-control" name="telefone" value="{{ paciente.telefone }}" required>
                </div>
                <div class="col-3 mt-2">
                    <label class="form-label">Valor da Sessão *</label>
                    <input type="text" class="form-control" name="valor_sessao" value="{{ paciente.valor_sessao }}" required>
                </div>
                <div class="col-3 mt-2" style="padding-top:28px">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                        <input type="checkbox" class="form-check-input" name="pacote_mensal" id="pacote_mensal"
                               {{ 'checked' if paciente.pacote_mensal }}
                               onchange="document.getElementById('campo_pacote').style.display=this.checked?'block':'none'">
                        Pacote Mensal?
                    </label>
                </div>
                <div class="col-3 mt-2" id="campo_pacote" style="{{ 'display:block' if paciente.pacote_mensal else 'display:none' }}">
                    <label class="form-label">Valor do Pacote</label>
                    <input type="text" class="form-control" name="valor_pacote" value="{{ paciente.valor_pacote or '' }}">
                </div>
            </div>

            <div class="hr"></div>
            <p class="text-muted small mb-3">Dados para Nota Fiscal <em>(opcional)</em></p>
            <div class="row">
                <div class="col-3">
                    <label class="form-label">CPF</label>
                    <input type="text" class="form-control" name="cpf" value="{{ nota.cpf if nota else '' }}">
                </div>
                <div class="col-2">
                    <label class="form-label">CEP</label>
                    <input type="text" class="form-control" name="cep" value="{{ nota.cep if nota else '' }}">
                </div>
                <div class="col-5">
                    <label class="form-label">Logradouro</label>
                    <input type="text" class="form-control" name="logradouro" value="{{ nota.logradouro if nota else '' }}">
                </div>
                <div class="col-2">
                    <label class="form-label">Número</label>
                    <input type="text" class="form-control" name="numero" value="{{ nota.numero if nota else '' }}">
                </div>
                <div class="col-4 mt-2">
                    <label class="form-label">Bairro</label>
                    <input type="text" class="form-control" name="bairro" value="{{ nota.bairro if nota else '' }}">
                </div>
                <div class="col-4 mt-2">
                    <label class="form-label">Cidade</label>
                    <input type="text" class="form-control" name="cidade" value="{{ nota.cidade if nota else '' }}">
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="{{ url_for('pacientes.perfil', id=paciente.id) }}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
