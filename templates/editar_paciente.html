{% extends 'base.html' %}
{% block conteudo %}
<h4>Editar Paciente</h4>
<form method="post">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Nome <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="nome" value="{{ paciente.nome }}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Data de Nascimento <span class="text-danger">*</span></label>
            <input type="date" class="form-control" name="data_nascimento" value="{{ paciente.data_nascimento }}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Telefone <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="telefone" value="{{ paciente.telefone }}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Valor da Sessão <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="valor_sessao" value="{{ paciente.valor_sessao }}" required>
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="pacote_mensal" name="pacote_mensal"
                       {{ 'checked' if paciente.pacote_mensal }}
                       onchange="document.getElementById('campo_pacote').style.display=this.checked?'block':'none'">
                <label class="form-check-label" for="pacote_mensal">Pacote Mensal?</label>
            </div>
        </div>
        <div class="col-md-3" id="campo_pacote" style="{{ 'display:block' if paciente.pacote_mensal else 'display:none' }}">
            <label class="form-label">Valor do Pacote</label>
            <input type="text" class="form-control" name="valor_pacote" value="{{ paciente.valor_pacote or '' }}">
        </div>
    </div>

    <hr class="my-4">
    <h6 class="text-muted">Dados para Nota Fiscal <small>(opcional)</small></h6>
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label">CPF</label>
            <input type="text" class="form-control" name="cpf" value="{{ nota.cpf if nota else '' }}">
        </div>
        <div class="col-md-2">
            <label class="form-label">CEP</label>
            <input type="text" class="form-control" name="cep" value="{{ nota.cep if nota else '' }}">
        </div>
        <div class="col-md-5">
            <label class="form-label">Logradouro</label>
            <input type="text" class="form-control" name="logradouro" value="{{ nota.logradouro if nota else '' }}">
        </div>
        <div class="col-md-2">
            <label class="form-label">Número</label>
            <input type="text" class="form-control" name="numero" value="{{ nota.numero if nota else '' }}">
        </div>
        <div class="col-md-4">
            <label class="form-label">Bairro</label>
            <input type="text" class="form-control" name="bairro" value="{{ nota.bairro if nota else '' }}">
        </div>
        <div class="col-md-4">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-control" name="cidade" value="{{ nota.cidade if nota else '' }}">
        </div>
    </div>

    <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{{ url_for('perfil_paciente', id=paciente.id) }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
