{% extends 'base.html' %}
{% block title %}Editar Gasto{% endblock %}
{% block page_title %}Editar Gasto{% endblock %}
{% block topbar_actions %}
<a href="{{ url_for('gastos.lista') }}" class="btn btn-outline btn-sm">← Voltar</a>
{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" value="{{ gasto.nome }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoria</label>
                        <input type="text" name="categoria" class="form-control" list="cats" value="{{ gasto.categoria }}">
                        <datalist id="cats">
                            {% for c in categorias %}<option value="{{ c }}">{% endfor %}
                        </datalist>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Valor Padrão (R$)</label>
                        <input type="number" name="valor_padrao" class="form-control" step="0.01" min="0"
                               value="{{ gasto.valor_padrao or '' }}" placeholder="Opcional">
                    </div>
                    <div class="mb-4">
                        <label class="d-flex align-items-center gap-2" style="cursor:pointer">
                            <input type="checkbox" name="fixo" class="form-check-input" {{ 'checked' if gasto.fixo }}>
                            <span>Gasto fixo (valor mantido todo mês)</span>
                        </label>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{{ url_for('gastos.lista') }}" class="btn btn-outline">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
