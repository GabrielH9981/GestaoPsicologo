{% extends 'base.html' %}
{% block conteudo %}
<h4>Cadastro de Paciente</h4>
<form method="POST">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Nome <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="nome" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Data de Nascimento <span class="text-danger">*</span></label>
            <input type="date" class="form-control" name="data_nascimento" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Telefone <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="telefone" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Valor da Sessão <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="valor_sessao" required>
        </div>
        <div class="col-md-3 d-flex align-items-end gap-3">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="pacote_mensal" name="pacote_mensal"
                       onchange="document.getElementById('campo_pacote').style.display=this.checked?'block':'none'">
                <label class="form-check-label" for="pacote_mensal">Pacote Mensal?</label>
            </div>
        </div>
        <div class="col-md-3" id="campo_pacote" style="display:none">
            <label class="form-label">Valor do Pacote</label>
            <input type="text" class="form-control" name="valor_pacote">
        </div>
    </div>

    <hr class="my-4">
    <h6 class="text-muted">Dados para Nota Fiscal <small>(opcional)</small></h6>
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label">CPF</label>
            <input type="text" class="form-control" name="cpf">
        </div>
        <div class="col-md-2">
            <label class="form-label">CEP</label>
            <input type="text" class="form-control" name="cep">
        </div>
        <div class="col-md-5">
            <label class="form-label">Logradouro</label>
            <input type="text" class="form-control" name="logradouro">
        </div>
        <div class="col-md-2">
            <label class="form-label">Número</label>
            <input type="text" class="form-control" name="numero">
        </div>
        <div class="col-md-4">
            <label class="form-label">Bairro</label>
            <input type="text" class="form-control" name="bairro">
        </div>
        <div class="col-md-4">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-control" name="cidade">
        </div>
    </div>

    <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Cadastrar</button>
        <a href="{{ url_for('lista_pacientes') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
